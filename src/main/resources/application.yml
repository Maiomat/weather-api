spring:
  application:
    name: weather-api

  datasource:
    url: jdbc:h2:mem:weatherdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

weather:
  api:
    base-url: "https://api.open-meteo.com"

  collection:
    interval-ms: 900000 # 15 minutes